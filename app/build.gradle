plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.uhm.uhmcs'
    compileSdk 35

    defaultConfig {
        applicationId "com.uhm.uhmcs.test0323"
        minSdk 24
        targetSdk 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.okhttp
    implementation libs.okhttp3.logging.interceptor // 日志拦截器

    implementation 'org.litepal.guolindev:core:3.2.3' //引入 LitePal 数据库

    implementation libs.baserecyclerviewadapterhelper

    implementation libs.glide
    implementation libs.recyclerview


    implementation libs.gson
    implementation libs.zxing.android.embedded // 封装了ZXing的核心功能
    implementation libs.core                 // 核心编码库
    implementation libs.cosmocalendar

    implementation libs.jjdxm.dialogui
    implementation libs.materialdatetimepicker
    implementation libs.rangepicker
    implementation libs.convenientbanner  // 轮播图核心库‌:ml-citation{ref="5" data="citationList"}
    implementation libs.updateapputilsx
    implementation libs.xpopup




}